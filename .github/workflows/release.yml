name: Release

on:
  release:
    types: [published]
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/project/datacurrent/
    # Trusted publishing: the OIDC token is exchanged for a short-lived upload
    # credential and PyPI attaches a signed provenance attestation.
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Check whether this version is already on PyPI
        id: check
        run: |
          python3 - <<'PY'
          import glob, os, urllib.error, urllib.request

          wheel = os.path.basename(sorted(glob.glob("dist/*.whl"))[0])
          version = wheel.split("-")[1]
          url = f"https://pypi.org/pypi/datacurrent/{version}/json"
          try:
              urllib.request.urlopen(url, timeout=15)
          except urllib.error.HTTPError as error:
              print(f"datacurrent {version} is not on PyPI ({error.code}); publishing.")
              publish = "true"
          else:
              print(f"datacurrent {version} is already on PyPI; skipping the upload.")
              publish = "false"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"publish={publish}\n")
          PY
      - name: Upload to PyPI
        if: steps.check.outputs.publish == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
