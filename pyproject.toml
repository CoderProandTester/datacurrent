[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datacurrent"
dynamic = ["version"]
description = "Python streaming, made simple: async streams, operators, backpressure and real-time transports."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "DataCurrent contributors" }]
keywords = [
    "streaming",
    "async",
    "asyncio",
    "real-time",
    "data pipeline",
    "stream processing",
    "backpressure",
    "reactive",
    "event bus",
    "pubsub",
    "websocket",
    "server-sent events",
    "http streaming",
    "concurrency",
    "observability",
    "http",
    "https",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Internet",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.27", "websockets>=12"]

[project.urls]
Homepage = "https://github.com/CoderProandTester/datacurrent"
Repository = "https://github.com/CoderProandTester/datacurrent"
Issues = "https://github.com/CoderProandTester/datacurrent/issues"
Changelog = "https://github.com/CoderProandTester/datacurrent/blob/main/CHANGELOG.md"
PyPI = "https://pypi.org/project/datacurrent/"

[project.optional-dependencies]
starlette = ["starlette>=0.36"]
fastapi = ["fastapi>=0.110"]
all = ["starlette>=0.36", "fastapi>=0.110"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "hypothesis>=6",
    "build>=1.2",
    "twine>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "fastapi>=0.110",
]


[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["datacurrent*"]

[tool.setuptools.package-data]
datacurrent = ["py.typed"]

[tool.setuptools.exclude-package-data]
datacurrent = ["__pycache__/*", "*.pyc"]

[tool.setuptools.dynamic]
version = { attr = "datacurrent._version.__version__" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "stress: long-running or high-volume tests",
    "network: tests that bind a local TCP port",
    "examples: runs the bundled examples",
]

[tool.coverage.run]
source = ["datacurrent"]
branch = true

[tool.coverage.report]
fail_under = 100
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "RUF"]
ignore = ["B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.11"
files = ["datacurrent"]
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
no_implicit_optional = true
